name: Build and Push All-in-One ERPNext Image

on:
  push:
    paths:
      - "apps.json"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 20 * * 0" # every Sunday 20:00 UTC (Monday 04:00 MYT)
  workflow_dispatch: {}

concurrency:
  group: build-allinone-erpnext
  cancel-in-progress: false

env:
  IMAGE: amirul123/allinone-erpnext
  FRAPPE_PATH: https://github.com/frappe/frappe
  FRAPPE_BRANCH: version-16
  PYTHON_VERSION: "3.14.0"
  NODE_VERSION: "24.12.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Checkout frappe_docker (build source)
        uses: actions/checkout@v5
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Validate apps.json and log app commits
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u
          test -f apps.json || { echo "::error::apps.json not found in repo root"; exit 1; }
          jq empty apps.json
          fail=0
          while read -r url branch; do
            ref="$(git ls-remote --heads --tags "$url" "$branch" | head -n1 | cut -c1-12)"
            if [ -z "$ref" ]; then
              echo "::error::Branch/tag '$branch' not found for $url"
              fail=1
            else
              echo "$url @ $branch -> $ref"
            fi
          done < <(jq -r '.[] | "\(.url) \(.branch)"' apps.json)
          exit $fail

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute date tag
        id: date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          build-args: |
            FRAPPE_PATH=${{ env.FRAPPE_PATH }}
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          secret-files: |
            apps_json=apps.json
          tags: |
            ${{ env.IMAGE }}:v16-${{ steps.date.outputs.d }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:v16', env.IMAGE) || '' }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}
