name: Build and Push All-in-One ERPNext Image

on:
  push:
    paths:
      - "apps.json"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Checkout frappe_docker (build source)
        uses: actions/checkout@v5
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute branch tag
        id: branch_tag
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          TAGS="amirul123/allinone-erpnext:${{ steps.branch_tag.outputs.tag }}"
          TAGS="$TAGS
          amirul123/allinone-erpnext:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="$TAGS
          amirul123/allinone-erpnext:latest"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            PYTHON_VERSION=3.11
            NODE_VERSION=20
          secret-files: |
            apps_json=apps.json
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
